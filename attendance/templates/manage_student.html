<div class="container-fluid">
    <form action="{% url 'save-student' %}" id="student-form" method="post">
        {% csrf_token %}
        {% if student %}
        <input type="hidden" name="id" value="{{ student.id }}">
        {% endif %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Enrollment Number</label>
                <input type="text" name="enrollment_number" value="{{ student.enrollment_number|default:'' }}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                       required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Course</label>
                <select name="course" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                        required>
                    <option value="">Select Course</option>
                    {% for course in courses %}
                    <option value="{{ course.id }}" {% if student.course_id == course.id %}selected{% endif %}>
                        {{ course.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">First Name</label>
                <input type="text" name="first_name" value="{{ student.first_name|default:'' }}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                       required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Last Name</label>
                <input type="text" name="last_name" value="{{ student.last_name|default:'' }}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                       required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Gender</label>
                <select name="gender" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                        required>
                    <option value="">Select Gender</option>
                    <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Contact</label>
                <input type="text" name="contact" value="{{ student.contact|default:'' }}" 
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                       required>
            </div>
        </div>
    </form>
</div>
