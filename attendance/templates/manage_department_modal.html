{% extends "base.html" %}

{% block modal_content %}
<form id="department-form" action="{% url 'save-department' %}" method="POST">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ department.id|default:'' }}">
    
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Department Name</label>
            <input type="text" name="name" value="{{ department.name|default:'' }}" 
                   class="mt-1 block w-full rounded-md border-gray-300" required>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Description</label>
            <textarea name="description" rows="3" 
                      class="mt-1 block w-full rounded-md border-gray-300">{{ department.description|default:'' }}</textarea>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Status</label>
            <select name="status" class="mt-1 block w-full rounded-md border-gray-300">
                <option value="1" {% if department.status == 1 %}selected{% endif %}>Active</option>
                <option value="0" {% if department.status == 0 %}selected{% endif %}>Inactive</option>
            </select>
        </div>
    </div>

    <div class="mt-6 flex justify-end space-x-3">
        <button type="button" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"
                onclick="uni_modal.hide()">Cancel</button>
        <button type="submit" 
                class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
            Save
        </button>
    </div>
</form>

<script>
$(document).ready(function() {
    $('#department-form').submit(function(e) {
        e.preventDefault();
        var form = $(this);
        
        $.ajax({
            url: form.attr('action'),
            type: 'POST',
            data: form.serialize(),
            dataType: 'json',
            success: function(resp) {
                if(resp.status == 'success') {
                    location.reload();
                } else {
                    alert_toast(resp.msg, 'error');
                }
            }
        });
    });
});
</script>
{% endblock %}
