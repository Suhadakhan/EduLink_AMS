{% extends 'base.html' %}
{% block title %}Export Data - Edulink{% endblock %}

{% block authenticated_content %}
<div class="bg-white rounded-lg shadow-lg p-6">
    <h2 class="text-xl font-semibold text-gray-900 mb-4">Data Export</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Students Export Card -->
        <div class="bg-white border rounded-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <i class="fas fa-user-graduate text-2xl text-indigo-600 mr-3"></i>
                    <h3 class="text-lg font-semibold">Students Data</h3>
                </div>
                <span class="text-sm text-gray-500">{{ students_count }} Records</span>
            </div>
            <div class="flex space-x-2">
                <button onclick="exportData('students', 'pdf')" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
                    <i class="fas fa-file-pdf mr-2"></i> PDF
                </button>
                <button onclick="exportData('students', 'excel')" class="inline-flex items-center px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                    <i class="fas fa-file-excel mr-2"></i> Excel
                </button>
            </div>
        </div>

        <!-- Courses Export Card -->
        <div class="bg-white border rounded-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center">
                    <i class="fas fa-book text-2xl text-purple-600 mr-3"></i>
                    <h3 class="text-lg font-semibold">Courses Data</h3>
                </div>
                <span class="text-sm text-gray-500">{{ courses_count }} Records</span>
            </div>
            <div class="flex space-x-2">
                <button onclick="exportData('courses', 'pdf')" class="inline-flex items-center px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700">
                    <i class="fas fa-file-pdf mr-2"></i> PDF
                </button>
                <button onclick="exportData('courses', 'excel')" class="inline-flex items-center px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                    <i class="fas fa-file-excel mr-2"></i> Excel
                </button>
            </div>
        </div>
    </div>
</div>

{% block ScriptBlock %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function exportData(type, format) {
    Swal.fire({
        title: 'Generating Export...',
        text: 'Please wait while we prepare your file.',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    $.ajax({
        url: "{% url 'export-data' %}",
        data: { 
            type: type,
            format: format,
            csrfmiddlewaretoken: '{{ csrf_token }}'
        },
        method: 'POST',
        xhrFields: {
            responseType: 'blob'
        },
        success: function(blob) {
            Swal.close();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${type}_export.${format}`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
        },
        error: function() {
            Swal.fire({
                icon: 'error',
                title: 'Export Failed',
                text: 'An error occurred while generating the export.'
            });
        }
    });
}
</script>
{% endblock %}
{% endblock %}
