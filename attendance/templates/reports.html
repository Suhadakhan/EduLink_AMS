{% extends 'base.html' %}
{% block title %}Generate Reports - Edulink{% endblock %}

{% block authenticated_content %}
<div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Generate Reports</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Departments Report -->
        <div class="bg-gray-50 p-4 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Departments Report</h2>
            <form action="{% url 'generate-report' %}" method="get" class="space-y-4">
                <input type="hidden" name="type" value="departments">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <select name="status" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="all">All</option>
                        <option value="1">Active</option>
                        <option value="2">Inactive</option>
                    </select>
                </div>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    <i class="fas fa-download mr-2"></i>Download PDF
                </button>
            </form>
        </div>

        <!-- Courses Report -->
        <div class="bg-gray-50 p-4 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Courses Report</h2>
            <form action="{% url 'generate-report' %}" method="get" class="space-y-4">
                <input type="hidden" name="type" value="courses">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Department</label>
                    <select name="department" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="all">All Departments</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <select name="status" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="all">All</option>
                        <option value="1">Active</option>
                        <option value="2">Inactive</option>
                    </select>
                </div>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    <i class="fas fa-download mr-2"></i>Download PDF
                </button>
            </form>
        </div>

        <!-- Faculty Report -->
        <div class="bg-gray-50 p-4 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Faculty Report</h2>
            <form action="{% url 'generate-report' %}" method="get" class="space-y-4">
                <input type="hidden" name="type" value="faculty">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Department</label>
                    <select name="department" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="all">All Departments</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    <i class="fas fa-download mr-2"></i>Download PDF
                </button>
            </form>
        </div>

        <!-- Students Report -->
        <div class="bg-gray-50 p-4 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Students Report</h2>
            <form action="{% url 'generate-report' %}" method="get" class="space-y-4">
                <input type="hidden" name="type" value="students">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Course</label>
                    <select name="course" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="all">All Courses</option>
                        {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">
                    <i class="fas fa-download mr-2"></i>Download PDF
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
