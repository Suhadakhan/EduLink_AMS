{% extends 'base.html' %}
{% block title %}Register - Edulink{% endblock %}

{% block unauthenticated_content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create your account</h2>
        </div>
        <form class="mt-8 space-y-6" id="register-form">
            {% csrf_token %}
            
            <!-- User Type Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Register as</label>
                <select name="user_type" id="user_type" class="mt-1 block w-full rounded-md border-gray-300" required>
                    <option value="">Select User Type</option>
                    <option value="faculty">Faculty</option>
                    <option value="student">Student</option>
                </select>
            </div>

            <!-- Basic Info -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">First Name</label>
                    <input type="text" name="first_name" class="mt-1 block w-full rounded-md border-gray-300" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Last Name</label>
                    <input type="text" name="last_name" class="mt-1 block w-full rounded-md border-gray-300" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" class="mt-1 block w-full rounded-md border-gray-300" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" class="mt-1 block w-full rounded-md border-gray-300" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" class="mt-1 block w-full rounded-md border-gray-300" required>
            </div>

            <!-- Faculty-specific fields -->
            <div id="faculty-fields" class="hidden space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Department</label>
                    <select name="department" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Student-specific fields -->
            <div id="student-fields" class="hidden space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Course</label>
                    <select name="course" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="">Select Course</option>
                        {% for course in courses %}
                        <option value="{{ course.id }}">{{ course.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Gender</label>
                    <select name="gender" class="mt-1 block w-full rounded-md border-gray-300">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Contact</label>
                <input type="text" name="contact" class="mt-1 block w-full rounded-md border-gray-300">
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                    Register
                </button>
            </div>
        </form>

        <div class="text-center">
            <a href="{% url 'login' %}" class="text-sm text-indigo-600 hover:text-indigo-500">
                Already have an account? Login
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block ScriptBlock %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
$(function() {
    // Toggle fields based on user type
    $('#user_type').change(function() {
        const userType = $(this).val();
        $('#faculty-fields').toggleClass('hidden', userType !== 'faculty');
        $('#student-fields').toggleClass('hidden', userType !== 'student');
    });

    // Form submission
    $('#register-form').submit(function(e) {
        e.preventDefault();
        
        // Show loading
        Swal.fire({
            title: 'Processing...',
            text: 'Creating your account',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });

        $.ajax({
            url: "{% url 'register' %}",
            method: 'POST',
            data: $(this).serialize(),
            success: function(response) {
                Swal.close();
                
                if (response.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'Registration Successful',
                        text: 'You can now login with your credentials',
                        confirmButtonText: 'Go to Login'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = "{% url 'login' %}";
                        }
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Registration Failed',
                        text: response.message
                    });
                }
            },
            error: function() {
                Swal.close();
                Swal.fire({
                    icon: 'error',
                    title: 'Registration Failed',
                    text: 'An error occurred. Please try again.'
                });
            }
        });
    });
});
</script>
{% endblock %}
