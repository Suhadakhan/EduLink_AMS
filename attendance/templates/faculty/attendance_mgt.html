{% extends 'base.html' %}
{% block authenticated_content %}
<div class="bg-white rounded-lg shadow-lg p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">{{ class.name }} - Attendance</h2>
    </div>

    <form id="attendance-form" class="space-y-6">
        {% csrf_token %}
        <input type="hidden" name="class_id" value="{{ class.id }}">
        
        <!-- Date Selection -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Date</label>
            <input type="date" name="attendance_date" value="{{ attendance_date|date:'Y-m-d' }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>

        <!-- Students List -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Student</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Present</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Late</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Absent</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    {% for student in students %}
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">
                                {{ student.student.first_name }} {{ student.student.last_name }}
                            </div>
                            <div class="text-sm text-gray-500">{{ student.student.enrollment_number }}</div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <input type="radio" name="student_{{ student.student.id }}" value="1" 
                                   {% if student.attendance == '1' %}checked{% endif %} required>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <input type="radio" name="student_{{ student.student.id }}" value="2"
                                   {% if student.attendance == '2' %}checked{% endif %}>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <input type="radio" name="student_{{ student.student.id }}" value="3"
                                   {% if student.attendance == '3' %}checked{% endif %}>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="flex justify-end">
            <button type="submit" 
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                Save Attendance
            </button>
        </div>
    </form>
</div>

<script>
document.getElementById('attendance-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    fetch("{% url 'save-attendance' %}", {
        method: 'POST',
        body: new FormData(this),
        headers: {
            'X-CSRFToken': this.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert('Attendance saved successfully');
            location.reload();
        } else {
            alert('Error: ' + data.message);
        }
    })
    .catch(error => {
        alert('Error saving attendance: ' + error);
    });
});

// Update attendance list when date changes
document.querySelector('input[name="attendance_date"]').addEventListener('change', function() {
    const baseUrl = "{% url 'attendance-page' class.id %}";
    const selectedDate = this.value;
    location.href = baseUrl + selectedDate + '/';
});
</script>
{% endblock %}
