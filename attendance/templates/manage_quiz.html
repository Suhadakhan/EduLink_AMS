{% extends "base.html" %}

{% block authenticated_content %}
<form id="quiz-form" method="POST">
    {% csrf_token %}
    <div class="space-y-4">
        <input type="hidden" name="id" value="{{ quiz.id|default:'' }}">
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Quiz Title</label>
            <input type="text" name="title" value="{{ quiz.title|default:'' }}" 
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                   required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Course</label>
            <select name="course" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500" required>
                <option value="">Select Course</option>
                {% for course in courses %}
                <option value="{{ course.id }}" {% if quiz.course.id == course.id %}selected{% endif %}>
                    {{ course.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Description</label>
            <textarea name="description" rows="3" 
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500">{{ quiz.description|default:'' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Duration (minutes)</label>
            <input type="number" name="duration" value="{{ quiz.duration|default:'' }}" 
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                   required min="1">
        </div>

        <div class="flex items-center">
            <input type="checkbox" name="is_active" {% if quiz.is_active %}checked{% endif %}
                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
            <label class="ml-2 block text-sm text-gray-900">Active</label>
        </div>
    </div>
</form>
{% endblock %}
